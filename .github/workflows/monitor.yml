name: Monitor IPP

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-ipp
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Ejecutar monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: timeout 280 python monitor_ipp.py || true
      - name: Guardar IDs conocidos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add known_ids.json
          git diff --cached --quiet && exit 0
          git commit -m "Actualizar known_ids.json"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((RANDOM % 5 + 2))
          done
          echo "No se pudo pushear known_ids.json despues de 5 intentos"
          exit 1
