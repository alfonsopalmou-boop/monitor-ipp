name: Monitor IPP (backstop ping)

# Dispara el endpoint /run del Cloudflare Worker como RED DE RESPALDO.
# El Worker es el motor principal (cron real */5 en Cloudflare). Este ping
# solo garantiza que, si el cron de Cloudflare se saltea o demora, la causa
# igual se levante. Comparte el mismo KV que el Worker -> NUNCA duplica alertas.

on:
  schedule:
    - cron: '*/5 * * * *'   # GitHub hace best-effort (suele espaciar a ~1-2h); alcanza como backstop
  workflow_dispatch:

concurrency:
  group: monitor-ipp
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Worker /run (comparte KV, no duplica)
        run: |
          echo "Ping de respaldo al Worker /run..."
          for i in 1 2 3; do
            resp=$(curl -s --max-time 60 "https://monitor-ipp.alfonso-palmou.workers.dev/run")
            echo "$resp"
            echo "$resp" | grep -q '"success": true' && exit 0
            echo "Reintentando en 5s..."
            sleep 5
          done
          echo "El Worker no respondio success tras 3 intentos"
          exit 1
